server:
  port: 8001
spring:
  application:
    name: VEHICLE-SERVICE
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:9002}
  datasource:
    url: ${VEHICLE_DB_URL:jdbc:mysql://localhost:13500/autocare_vehicle?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${VEHICLE_DB_USER:root}
    password: ${VEHICLE_DB_PASSWORD:mysql}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
autocare:
  storage-path: ${AUTOCARE_STORAGE_PATH:${user.home}/.autocare/vehicles}
eureka:
  instance:
    hostname: "${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME:localhost}}"
    instance-id: "${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME:${spring.application.name}}}:${spring.application.name}:${server.port}"
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://localhost:9001/eureka/}"
management:
  endpoints.web.exposure.include: health,info
